# Generic template. Adapt the column names and enum maps to your export. Not tied to any vendor format.
name: defects_generic
target: defects
delimiter: ','
encoding: utf-8
missing_markers:
- ''
- N/A
- n/a
- '-'
- 'NULL'
timezone:
  mode: utc
  default_offset: +00:00
provenance: operator-export
columns:
  tail:
    source: tail
    type: str
    required: true
  date:
    source: date
    type: date
    required: true
  ata:
    source: ata
    type: str
    required: true
  text:
    source: text
    type: str
    required: true
  mel_ref:
    source: mel_ref
    type: str
    required: false
  deferral_category:
    source: deferral_category
    type: str
    required: false
  rectified_at:
    source: rectified_at
    type: datetime
    required: false
